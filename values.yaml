global:
  # Shared registry override also reaches the vendored listener dependency.
  imageRegistry: ""
replicaCount: 1
revisionHistoryLimit: 3

image:
  # Overrides core, receiver and watcher; global.imageRegistry takes precedence.
  registry: ""
  repository: docker.io/kimc1992/dorarion-core
  pullPolicy: IfNotPresent
  # Docker Hub core 0.0.7, pinned to the verified linux/amd64 manifest.
  tag: "0.0.7"
  digest: "sha256:3612981b1db1fc898311eaeb091c15964737b25ab31504c5ac6086d5d896a2c2"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Absolute browser origin used for secure cookies, GitLab CI reporting URLs,
# and links returned by Dorarion. Set this explicitly for every installation.
publicUrl: ""
allowInsecurePublicUrl: false

# This Secret must exist before `helm install` because the migration Job is a
# pre-install/pre-upgrade hook. Do not put credentials directly in values.yaml.
existingSecret: dorarion-secrets
secretKeys:
  databaseUrl: DATABASE_URL
  jwtSecret: JWT_SECRET
  encryptionKey: SECRET_ENCRYPTION_KEY
  bootstrapPassword: DORARION_BOOTSTRAP_PASSWORD

database:
  connectionPoolSize: 15
  statementTimeoutMs: 30000
  # Exact hosts on a reviewed private network only; external URLs need verify-full.
  trustedHosts: []

security:
  jwtIssuer: dorarion-core
  jwtAudience: dorarion-api
  jwtTtlSeconds: 600
  refreshTokenTtlSeconds: 2592000
  encryptionKeyRef: local:v1
  # Deprecated broad override; prefer the separate allowlists below.
  allowPrivateWebhookDestinations: false
  # DNS names/IPs or CIDRs. No URL schemes, paths (except CIDR), or ports.
  privateProviderHosts: []
  privateWebhookHosts: []
  # External env:// secrets should normally use the DORARION_EXT_ prefix.
  # Key in existingSecret, not the plaintext token. Empty keeps admin-only metrics.
  metricsScrapeTokenSecretKey: ""
  secretEnvAllowlist: []
  trustedProxies: []
  reportRecipientDomains: []
  readmeImageOrigins: []

# Optional first-install administrator. Enable only for a new, empty Dorarion
# database. Supply a >=16-character password through the existing Secret.
bootstrapAdmin:
  enabled: false
  username: admin
  email: ""
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: dorarion.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
podLabels: {}

# Use valueFrom for sensitive additions such as SMTP_PASSWORD or notification
# webhook variables. Do not put their literal values in values.yaml.
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

networkPolicy:
  enabled: false
  ingress: []
  egress: []
podDisruptionBudget:
  enabled: false
  minAvailable: 1

rollout:
  restartAt: ""
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

# Allow workers to drain bounded outbound requests before Kubernetes sends SIGKILL.
terminationGracePeriodSeconds: 120

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 24
  liveness:
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

migration:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# The chart is vendored for reproducible, offline installation.
listener:
  enabled: false
  renderFromParent: true
  watcher:
    enabled: false
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTokenSecretKey: DORARION_METRICS_SCRAPE_TOKEN
