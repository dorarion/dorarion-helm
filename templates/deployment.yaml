apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dorarion.fullname" . }}
  labels:
    {{- include "dorarion.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.rollout.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "dorarion.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations .Values.rollout.restartAt }}
      annotations:
        {{- with .Values.rollout.restartAt }}
        dorarion.io/restarted-at: {{ . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "dorarion.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dorarion
          image: {{ include "dorarion.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "dorarion.installationPolicyEnv" . | nindent 12 }}
            - name: DORARION_MIGRATE_ON_START
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dorarion.secretName" . }}
                  key: {{ .Values.secretKeys.databaseUrl }}
            - name: DB_CONNECTION_POOL_SIZE
              value: {{ .Values.database.connectionPoolSize | int64 | quote }}
            - name: DORARION_COOKIE_SECURE
              value: {{ hasPrefix "https://" (include "dorarion.publicUrl" .) | quote }}
            - name: DORARION_PUBLIC_URL
              value: {{ include "dorarion.publicUrl" . | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dorarion.secretName" . }}
                  key: {{ .Values.secretKeys.jwtSecret }}
            - name: JWT_ISSUER
              value: {{ .Values.security.jwtIssuer | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.security.jwtAudience | quote }}
            - name: JWT_TTL_SECONDS
              value: {{ .Values.security.jwtTtlSeconds | int64 | quote }}
            - name: REFRESH_TOKEN_TTL_SECONDS
              value: {{ .Values.security.refreshTokenTtlSeconds | int64 | quote }}
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dorarion.secretName" . }}
                  key: {{ required "secretKeys.encryptionKey is required" .Values.secretKeys.encryptionKey }}
            - name: SECRET_ENCRYPTION_KEY_REF
              value: {{ .Values.security.encryptionKeyRef | quote }}
            - name: ALLOW_PRIVATE_WEBHOOK_DESTINATIONS
              value: {{ .Values.security.allowPrivateWebhookDestinations | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
