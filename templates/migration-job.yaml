apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dorarion.fullname" . }}-migrate
  labels:
    {{- include "dorarion.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "dorarion.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "dorarion.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "dorarion.installationPolicyEnv" . | nindent 12 }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "dorarion.secretName" . }}
                  key: {{ .Values.secretKeys.databaseUrl }}
            - name: DB_CONNECTION_POOL_SIZE
              value: "1"
            # These references make missing required Secret keys fail the
            # blocking hook before the application Deployment is changed.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dorarion.secretName" . }}
                  key: {{ .Values.secretKeys.jwtSecret }}
            - name: JWT_ISSUER
              value: {{ .Values.security.jwtIssuer | quote }}
            - name: JWT_AUDIENCE
              value: {{ .Values.security.jwtAudience | quote }}
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dorarion.secretName" . }}
                  key: {{ .Values.secretKeys.encryptionKey }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
