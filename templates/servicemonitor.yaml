{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "dorarion.fullname" . }}
spec:
  selector:
    matchLabels:
      {{- include "dorarion.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      authorization:
        credentials:
          name: {{ include "dorarion.secretName" . }}
          key: {{ .Values.serviceMonitor.scrapeTokenSecretKey }}
{{- end }}
